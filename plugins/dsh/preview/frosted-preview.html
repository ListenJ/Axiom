<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axiom Frosted Glass Theme Preview</title>
<style>
  /* 模拟 DSH 深色背景 */
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 20% 30%, rgba(99,102,241,0.25), transparent 60%),
      radial-gradient(900px 500px at 80% 70%, rgba(139,92,246,0.18), transparent 55%),
      #0a0a0e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
    color: rgba(255,255,255,0.9);
    display: grid;
    grid-template-columns: 240px 1fr 280px;
    gap: 12px;
    padding: 12px;
    box-sizing: border-box;
  }
  .sidebar, .main, .rightbar, .composer, .modal, .card {
    border-radius: 12px;
    background: rgba(18,18,24,0.65);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  }
  .sidebar { padding: 16px; }
  .rightbar { padding: 16px; }
  .main { padding: 24px; position: relative; }
  .composer {
    margin-top: 16px;
    padding: 12px;
    background: rgba(24,24,32,0.55);
    backdrop-filter: blur(12px) saturate(1.2);
    -webkit-backdrop-filter: blur(12px) saturate(1.2);
  }
  .card {
    padding: 16px;
    background: rgba(32,32,42,0.45);
    border: 1px solid rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12) 50%, transparent);
    pointer-events: none;
  }
  .divider {
    height: 1px;
    border: none;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08) 20%, rgba(255,255,255,0.08) 80%, transparent);
    margin: 12px 0;
  }
  .modal {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(8,8,12,0.55);
    backdrop-filter: blur(24px) saturate(1.5);
    -webkit-backdrop-filter: blur(24px) saturate(1.5);
  }
  .modal-inner {
    width: 320px;
    padding: 20px;
    border-radius: 16px;
    background: rgba(18,18,26,0.78);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .muted { color: rgba(255,255,255,0.5); font-size: 13px; }
  h3 { margin-top: 0; }
</style>
</head>
<body>
  <aside class="sidebar">
    <h3>侧边栏</h3>
    <p class="muted">blur(20px) saturate(1.4)</p>
    <div class="divider"></div>
    <p class="muted">会话记录 / 文件树</p>
    <p class="muted">渐变分割代替硬线</p>
  </aside>

  <main class="main">
    <h3>主内容区</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
      <div class="card"><strong>Deep Research</strong><p class="muted">半透明卡片 + 顶部微光</p></div>
      <div class="card"><strong>Code Review</strong><p class="muted">细边框 + 无硬分割线</p></div>
      <div class="card"><strong>Knowledge Q&amp;A</strong><p class="muted">径向渐变背景透出</p></div>
      <div class="card"><strong>Creative Writing</strong><p class="muted">Glassmorphism</p></div>
    </div>
    <div class="composer">
      <span class="muted">输入区 blur(12px) saturate(1.2)</span>
    </div>
  </main>

  <aside class="rightbar">
    <h3>工具台</h3>
    <p class="muted">系统统计</p>
    <div class="divider"></div>
    <p class="muted">Tokens 0 · 缓存 0%</p>
    <p class="muted">主动能已在 DSH 原生实现，不重复封装</p>
  </aside>

  <div class="modal">
    <div class="modal-inner">
      <h3>弹出层</h3>
      <p class="muted">blur(24px) saturate(1.5)，最强磨砂</p>
      <button onclick="this.closest('.modal').style.display='none'" style="margin-top:12px;padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(99,102,241,0.2);color:#fff;cursor:pointer">关闭</button>
    </div>
  </div>
</body>
</html>
