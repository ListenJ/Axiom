# axiom-kb-dsh bundle patch —— 把 Axiom 知识库（Vault 记忆 + 知识图谱）作为独立插件装载进 DeepSeek Harness。
#
# 生效顺序（后者获胜）：profile bundles → profile cordis.patch.yml →
# $DSH_HOME/cordis.patch.yml → 命令行 --patch。
# 行 id `kb` 是配置树中的稳定身份；覆盖时整段替换 config，需重述全部所需键。
#
# 默认值说明：
#   - mcpEnabled=true：以 stdio 拉起插件内置后端（Vault 记忆 + 知识图谱引擎 + MCP 服务器，
#     backend/server.js），仅桥接知识库白名单工具，以 kb__<tool> 暴露；无需外部 Axiom 仓库。
#   - toolFilter=[]：空数组 = 使用内置 KB 白名单（memory_/code_index/kg_/kal_/dip_ 前缀）；
#     显式提供数组时完全替换默认白名单（支持前缀（以 _ 结尾）或全名）。
#   - 联网检索工具（web_fetch/web_search/search_engines_list）不属于本插件能力面，不进入插件队列。
#   - mcpFailOnStartupError=false：容忍模式（连接失败仅告警，插件仍可加载）；
#     true 为严格模式（初始连接失败即让 fiber 失败）。
#   - 数据目录 dataDir 自动创建：Vault 笔记（axiom-memory/）与知识图谱 SQLite（data/kg.db）。
- insert:
    - id: kb
      name: 'axiom-kb-dsh'
      config:
        mcpEnabled: true
        mcpServerName: 'kb'
        mcpToolCallTimeoutMs: 60000
        mcpFailOnStartupError: false
        toolFilter: []
