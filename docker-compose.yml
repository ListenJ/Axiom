version: "3.8"

services:
  axiom-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axiom-agent
    restart: unless-stopped
    ports:
      - "${AXIOM_GATEWAY_PORT:-18789}:18789"
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./axiom-memory:/app/axiom-memory
      - ./config:/app/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  lightpanda:
    image: ghcr.io/lightpanda-io/browser:latest
    container_name: axiom-lightpanda
    command: serve
    ports:
      - "9222:9222"
    restart: unless-stopped
    mem_limit: 256M
