version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: openclaw-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: openclaw
      POSTGRES_USER: openclaw
      POSTGRES_PASSWORD: ${PG_PASSWORD:-openclaw_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/pg-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclaw"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  openclaw-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw-agent
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "3001:3001"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://openclaw:${PG_PASSWORD:-openclaw_secret}@postgres:5432/openclaw
    volumes:
      - ./data:/app/data
      - ./openclaw-memory:/app/openclaw-memory
      - ./config:/app/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
