<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0f19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<title>OpenClaw AI Agent — Vault 核心记忆</title>
<style>
:root {
  --bg: #0b0f19; --card: #151b2b; --text: #e2e8f0; --muted: #64748b;
  --accent: #38bdf8; --success: #4ade80; --warn: #fbbf24; --danger: #f87171;
  --purple: #a78bfa; --orange: #fb923c; --border: #1e293b; --hover: #334155;
  --sidebar-w: 220px; --header-h: 56px;
}
[data-theme="light"] {
  --bg: #f8fafc; --card: #fff; --text: #1e293b; --muted: #64748b;
  --accent: #0284c7; --border: #e2e8f0; --hover: #f1f5f9;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
  overflow-x: hidden; -webkit-font-smoothing: antialiased;
}
#app { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: var(--sidebar-w); background: var(--card); border-right: 1px solid var(--border);
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
  transform: translateX(0); transition: transform 0.3s ease;
  display: flex; flex-direction: column; overflow-y: auto;
}
.sidebar.closed { transform: translateX(-100%); }
.sidebar-header {
  padding: 16px; border-bottom: 1px solid var(--border); display: flex;
  align-items: center; gap: 8px; font-size: 1.1rem; font-weight: 700;
}
.sidebar-header .logo { font-size: 1.4rem; }
.nav-items { flex: 1; padding: 8px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: 8px; cursor: pointer; transition: background 0.15s;
  color: var(--muted); font-size: 0.9rem; margin-bottom: 2px;
}
.nav-item:hover { background: var(--hover); color: var(--text); }
.nav-item.active { background: var(--hover); color: var(--accent); }
.nav-item .icon { font-size: 1.1rem; width: 22px; text-align: center; }
.sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
.sidebar-footer .version { font-size: 0.7rem; color: var(--muted); text-align: center; }

/* Overlay for mobile */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.overlay.show { opacity: 1; pointer-events: auto; }

/* Header */
.header {
  height: var(--header-h); background: var(--card); border-bottom: 1px solid var(--border);
  position: fixed; top: 0; left: var(--sidebar-w); right: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
  transition: left 0.3s;
}
.header.full { left: 0; }
.header .left { display: flex; align-items: center; gap: 12px; }
.hamburger {
  display: none; width: 36px; height: 36px; border-radius: 8px;
  background: var(--hover); border: none; color: var(--text); font-size: 1.2rem; cursor: pointer;
}
.header-title { font-size: 1rem; font-weight: 600; }
.header .right { display: flex; align-items: center; gap: 8px; }
.status-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.theme-btn, .refresh-btn {
  width: 36px; height: 36px; border-radius: 8px; background: var(--hover);
  border: none; color: var(--text); cursor: pointer; font-size: 1rem;
}

/* Main */
.main {
  margin-left: var(--sidebar-w); margin-top: var(--header-h);
  padding: 20px; min-height: calc(100vh - var(--header-h));
  transition: margin-left 0.3s; max-width: 1400px;
}
.main.full { margin-left: 0; }

/* Mobile */
@media (max-width: 768px) {
  .hamburger { display: flex; align-items: center; justify-content: center; }
  .header { left: 0; }
  .main { margin-left: 0; padding: 12px; }
  .sidebar { width: 260px; }
}

/* Common Components */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 20px; }
.card {
  background: var(--card); border-radius: 12px; padding: 16px;
  border: 1px solid var(--border); transition: border-color 0.2s;
}
.card:hover { border-color: var(--hover); }
.card h2 { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.metric { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
.metric-label { font-size: 0.75rem; color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
  border-radius: 8px; background: var(--accent); color: #fff; border: none;
  cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: opacity 0.15s;
}
.btn:hover { opacity: 0.9; }
.btn.secondary { background: var(--hover); color: var(--text); }
.btn.small { padding: 6px 12px; font-size: 0.8rem; }
.input {
  flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 14px; color: var(--text); font-size: 0.9rem; outline: none;
}
.input:focus { border-color: var(--accent); }
textarea.input { min-height: 120px; resize: vertical; font-family: inherit; }
.select {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; color: var(--text); font-size: 0.85rem; outline: none;
}
.search-box { display: flex; gap: 8px; margin-bottom: 16px; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
  border-radius: 999px; font-size: 0.7rem; background: var(--hover);
}
.badge.ok { background: #064e3b; color: var(--success); }
.badge.warn { background: #451a03; color: var(--warn); }
.badge.danger { background: #450a0a; color: var(--danger); }

/* Tabs */
.tab-nav { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; overflow-x: auto; }
.tab-nav button {
  background: none; border: none; color: var(--muted); padding: 8px 14px;
  cursor: pointer; border-radius: 6px; font-size: 0.85rem; white-space: nowrap;
}
.tab-nav button.active { background: var(--hover); color: var(--text); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Chat */
.chat-container { display: flex; flex-direction: column; height: calc(100vh - 140px); }
.chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.msg {
  max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem;
  word-break: break-word;
}
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
.msg.assistant { align-self: flex-start; background: var(--hover); }
.msg.system { align-self: center; font-size: 0.8rem; color: var(--muted); background: none; }
.msg pre { background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 0.8rem; margin-top: 6px; }
.msg code { font-family: monospace; font-size: 0.85rem; }
.chat-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }

/* Search results */
.result-item {
  padding: 12px; border-radius: 8px; background: var(--bg); margin-bottom: 8px;
  border: 1px solid var(--border); cursor: pointer; transition: border-color 0.2s;
}
.result-item:hover { border-color: var(--accent); }
.result-item .score { color: var(--accent); font-size: 0.8rem; font-weight: 600; }
.result-item .title { font-weight: 600; margin: 4px 0; }
.result-item .path { font-size: 0.75rem; color: var(--muted); font-family: monospace; }
.result-item .snippet { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

/* Vault */
.vault-browser { display: grid; grid-template-columns: 250px 1fr; gap: 16px; }
@media (max-width: 768px) { .vault-browser { grid-template-columns: 1fr; } }
.vault-sidebar { background: var(--card); border-radius: 12px; padding: 12px; border: 1px solid var(--border); }
.vault-sidebar h3 { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
.vault-item { padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; color: var(--muted); }
.vault-item:hover { background: var(--hover); color: var(--text); }
.vault-item.active { background: var(--hover); color: var(--accent); }
.vault-content { background: var(--card); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }

/* Code Agent */
.code-output { background: var(--bg); border-radius: 8px; padding: 12px; border: 1px solid var(--border); font-family: monospace; font-size: 0.85rem; overflow-x: auto; white-space: pre-wrap; }
.code-output .issue { color: var(--warn); }
.code-output .suggestion { color: var(--success); }

/* Loading */
.loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: var(--muted); }
.spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--hover); }

/* Bottom nav for mobile */
.bottom-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--card); border-top: 1px solid var(--border);
  z-index: 50; justify-content: space-around; padding: 6px 0;
}
.bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 8px; color: var(--muted); font-size: 0.65rem; cursor: pointer; border: none; background: none; }
.bottom-nav-item.active { color: var(--accent); }
.bottom-nav-item .icon { font-size: 1.2rem; }
@media (max-width: 768px) {
  .bottom-nav { display: flex; }
  .main { padding-bottom: 70px; }
}

/* Knowledge review notification */
.review-notification {
  display: none; align-items: center; gap: 8px; padding: 6px 14px;
  background: var(--warn); color: #1a1a1a; border-radius: 20px;
  font-size: 0.8rem; font-weight: 600; cursor: pointer;
  margin-left: auto; margin-right: 12px;
  transition: background 0.2s, transform 0.15s;
  white-space: nowrap;
}
.review-notification:hover { transform: scale(1.05); background: #fcd34d; }
.review-dot {
  width: 8px; height: 8px; background: #dc2626; border-radius: 50%;
  display: inline-block; animation: pulse-dot 1.5s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.3); }
}
.btn.ok { background: var(--success); color: #1a1a1a; }
.btn.danger { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<div id="app">
  <div class="overlay" id="overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><span class="logo">🦅</span> OpenClaw</div>
    <nav class="nav-items" id="navItems"></nav>
    <div class="sidebar-footer"><div class="version">v2.2 · Agent Hub</div></div>
  </aside>

  <!-- Header -->
  <header class="header" id="header">
    <div class="left">
      <button class="hamburger" id="hamburger">☰</button>
      <span class="header-title" id="pageTitle">Dashboard</span>
    </div>
    <div class="right">
      <span class="badge ok" id="connStatus"><span class="status-dot"></span> 在线</span>
      <button class="theme-btn" id="themeBtn">🌙</button>
      <button class="refresh-btn" onclick="location.reload()">⟳</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main" id="main"><div id="pageContent"></div></main>

  <!-- Bottom Navigation (mobile) -->
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<script src="/app.js"></script>
</body>
</html>
