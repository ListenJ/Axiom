version: '3.8'

services:
  openclaw:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: openclaw-agent
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
    env_file:
      - ../../.env
    volumes:
      - openclaw-data:/app/data
      - openclaw-vault:/app/data/vault
      - openclaw-codegraph:/app/.codegraph
    networks:
      - openclaw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  openclaw-data:
  openclaw-vault:
  openclaw-codegraph:

networks:
  openclaw-network:
    driver: bridge
