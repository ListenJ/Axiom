version: '3.8'

services:
  axiom:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: axiom-agent
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
    env_file:
      - ../../.env
    volumes:
      - axiom-data:/app/data
      - axiom-vault:/app/data/vault
      - axiom-codegraph:/app/.codegraph
    networks:
      - axiom-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  axiom-data:
  axiom-vault:
  axiom-codegraph:

networks:
  axiom-network:
    driver: bridge
