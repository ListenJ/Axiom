use_default_settings: true
general:
  instance_name: "Axiom SearXNG"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh-CN"
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "127.0.0.1"
  # 生产部署请替换为随机值（openssl rand -hex 32）；默认值仅限本地开发
  secret_key: "axiom-searxng-dev-local-only"
  limiter: false
  public_instance: false

ui:
  static_use_hash: true
