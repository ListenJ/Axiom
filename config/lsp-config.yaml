# LSP 语言服务器配置
# 编码 Agent 通过 agent-lsp 获取代码级智能

servers:
  typescript:
    command: "typescript-language-server"
    args: ["--stdio"]
    filetypes: ["typescript", "javascript", "tsx", "jsx"]

  python:
    command: "pyright-langserver"
    args: ["--stdio"]
    filetypes: ["python"]

  rust:
    command: "rust-analyzer"
    args: []
    filetypes: ["rust"]

  go:
    command: "gopls"
    args: ["serve"]
    filetypes: ["go"]

settings:
  # 代码诊断
  diagnostics:
    enable: true
    debounce: 300

  # 补全
  completion:
    enable: true
    triggerCharacters: [".", ":", ">"]

  # 格式化
  formatting:
    enable: true
    defaultFormatter: "prettier"
