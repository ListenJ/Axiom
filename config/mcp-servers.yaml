# MCP服务器注册配置
# 免费方案：无需 API Key，开箱即用
# 运行时：统一使用 bun/bunx（非 node/npx）
servers:
  # Context7 — 文档查询（免费，无需 API Key）
  # 提供 7000+ 库的版本化文档
  context7:
    type: "remote"
    url: "https://mcp.context7.com/mcp"

  # free-search — 多引擎网络搜索（DuckDuckGo, Mojeek, Startpage）
  # 无需 API Key，本地优先
  free-search:
    command: "bunx"
    args: ["-y", "free-search-mcp"]
    optional: true

  # freeweb — 网页浏览和内容提取（7层回退，无需 API Key）
  # 支持 Playwright 浏览器自动化
  freeweb:
    command: "bunx"
    args: ["-y", "freeweb-mcp"]

  # 文件系统访问
  filesystem:
    command: "bunx"
    args: ["-y", "@modelcontextprotocol/server-filesystem", "."]
    optional: true

  # Obsidian Vault操作
  obsidian:
    command: "bun"
    args: ["run", "src/mcp/server.ts"]
    env: {}
    timeoutMs: "${MCP_CONNECT_TIMEOUT_MS:-10000}"

  # OpenCode 编码 Agent（通过 stdio 暴露编码工具）
  opencode:
    command: "bun"
    args: ["run", "src/mcp/server.ts", "--stdio"]
    env:
      OPENCODE_API_KEY: "${OPENCODE_API_KEY}"
      OPENCODE_DEFAULT_MODEL: "opencode/deepseek-v4-flash-free"

  # ── 金融数据接口（量化交易支撑，2026-10-07 接入）────────────────────────
  # 分级策略见 skill `china-market-data`：Wind(Tier-0 付费) > iFind(Tier-1 付费) > AkShare(Tier-2 免费)
  #
  # akShare — **免费、无需密钥**，覆盖 A 股行情/财报/指数/宏观/基金。
  # 注意（实测 2026-10-07）：上游 eastmoney/sina 单次请求可达 30s，
  # 故 timeoutMs 放宽到 120s；批量抓取请走 runtime-data/ 的脚本而非交互式调用。
  akshare:
    command: "/run/media/listen/base/openclaw-fusion/runtime-data/.venv/bin/python"
    args: ["-m", "akshare_mcp"]
    optional: true
    timeoutMs: "${MCP_AKSHARE_TIMEOUT_MS:-120000}"
    note: "A股/指数/宏观，免费；上游慢，仅适合批处理"

  # Wind（万得）— Tier-0 最全，44 个工具 / 8 个服务域（A股/港美股/基金/指数/债券/
  # 公司公告/宏观 EDB/通用取数）。**量化建模首选数据源**。
  #
  # 形态说明：Wind 是**远程 MCP**（https://mcp.wind.com.cn/vserver_<domain>/mcp/，Bearer 认证），
  # 仓库内 mcp-servers/wind-mcp/server.py 是把它封装成本地 FastMCP 的**stdio 适配器**，
  # 故这里配 command 而非 url。认证走 env 占位符 ${WIND_API_KEY}（client-connector 展开）。
  #
  # 依赖：runtime-data/.venv 已装 mcp==1.30.0（**必须 <2**，见该目录 requirements.txt 注释）。
  # 无 WIND_API_KEY 时：optional 使其降级为 info 日志，不影响其他 MCP/启动。
  # 未配 key 时 optional 跳过，不阻塞启动。
  wind:
    command: "/run/media/listen/base/openclaw-fusion/runtime-data/.venv/bin/python"
    args: ["/run/media/listen/base/openclaw-fusion/mcp-servers/wind-mcp/server.py"]
    optional: true
    env:
      WIND_API_KEY: "${WIND_API_KEY}"
      WIND_CONCURRENCY: "${WIND_CONCURRENCY:-5}"
    timeoutMs: 60000
    note: "付费(积分制)；研报+量化分析最全，A股/港美股/基金/指数/债券/宏观/公告"

  # 同花顺 iFind — Tier-1，精确财务/一致预期/ESG/债券/港美股/宏观。
  # 需 IFIND_AUTH_TOKEN；并发限制：免费 2/s、个人 5/s、企业 10/s。
  ifind:
    command: "bunx"
    args: ["-y", "ifind-mcp"]
    optional: true
    env:
      IFIND_AUTH_TOKEN: "${IFIND_AUTH_TOKEN}"
    note: "付费；精确财务与一致预期"
