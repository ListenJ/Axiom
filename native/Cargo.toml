[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"
dashmap = "6.1"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
aho-corasick = "1.1"
lru = "0.12"
bytes = "1.8"
uuid = { version = "1.11", features = ["v4", "serde"] }

# Local / Cloud conditional
rusqlite = { version = "0.32", features = ["bundled", "fts5", "json"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
deadpool-postgres = { version = "0.14" }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.local]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 4

