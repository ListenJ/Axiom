[package]
name = "axiom-cloud"
version = "2.3.0"
edition = "2021"

[[bin]]
name = "axiom-cloud"
path = "src/main.rs"

[dependencies]
oc-shared = { path = "../shared" }
oc-search = { path = "../search" }
oc-route = { path = "../route" }
tokio = { workspace = true, features = ["full", "rt-multi-thread"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive"] }
axum = { version = "0.7", features = ["tokio", "http1", "http2"] }
tower = { version = "0.5", features = ["limit", "load-shed"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "limit"] }
redis = { workspace = true, features = ["tokio-comp", "connection-manager", "cluster-async"] }
deadpool-postgres = { workspace = true }
tokio-postgres = { workspace = true }

