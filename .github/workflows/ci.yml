name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  BUN_VERSION: "1.3"

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (tsc --noEmit)
        run: bun run lint

      - name: Run unit tests
        run: bun run test:full
        env:
          NODE_ENV: test

      - name: Run runtime audit (resource & bounds gate)
        run: bun run audit:runtime
        env:
          NODE_ENV: test

      - name: Run linter
        run: bun run lint

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          NODE_ENV: test

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  stress-test:
    name: Stress & Performance Gate
    runs-on: ubuntu-latest
    needs: test
    # 性能门禁是合并门禁；extreme-stress 与 baseline 对比仅作报告（避免 CI 抖动误报）
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore performance baseline
        id: restore-baseline
        uses: actions/cache@v4
        with:
          path: reports/stress/baseline.json
          key: perf-baseline-${{ runner.os }}-${{ github.base_ref || github.ref }}
          restore-keys: |
            perf-baseline-${{ runner.os }}-

      - name: Run performance gate (CI blocker)
        run: bun run test:gate
        env:
          NODE_ENV: test

      - name: Run full stress suite with baseline comparison
        run: bun run stress:compare || true
        env:
          NODE_ENV: test

      - name: Generate visualization report
        run: bun run stress:report
        if: always()

      - name: Upload stress reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-reports-${{ github.sha }}
          path: reports/stress/
          retention-days: 30

      - name: Update baseline (main branch only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          bun run stress:baseline
          echo "Baseline updated for ${{ github.ref }}"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run audit
        run: bun audit
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified
  deploy-smoke:
    name: Linux Deploy Smoke (pm2 + runtime audit)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pm2
        run: npm install -g pm2

      - name: Build server bundle
        run: bun run build

      - name: Start under pm2 and smoke test
        env:
          AXIOM_GATEWAY_PORT: "18799"
          HOST: "127.0.0.1"
          AXIOM_AUTH_TOKEN: "ci-smoke-token"
        run: |
          pm2 start deploy/pm2/ecosystem.config.json --update-env
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18799/health || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18799/health > /dev/null
          bun run audit:runtime
          curl -fsS -H "Authorization: Bearer ci-smoke-token" http://127.0.0.1:18799/api/audit/diagnostics > /dev/null
          pm2 restart axiom-agent
          sleep 2
          curl -fsS http://127.0.0.1:18799/health > /dev/null
          pm2 delete axiom-agent
