name: Frontend Visual Audit

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ??????????? / ???? / E2E??????????
on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - "public/**"
  pull_request:
    branches: [main, master]
    paths:
      - "frontend/**"
      - "public/**"

env:
  BUN_VERSION: "1.3.14"

jobs:
  frontend-audit:
    name: Frontend Visual Audit (SenseNova)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright chromium
        run: npx playwright install chromium

      - name: Generate ephemeral auth token
        shell: bash
        run: echo "AXIOM_AUTH_TOKEN=$(node -e 'console.log(require("crypto").randomBytes(16).toString("hex"))')" >> "$GITHUB_ENV"

      - name: Run frontend visual audit gate
        run: ./.ci/frontend-audit.sh
        env:
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-audit-report
          path: reports/frontend-audit-*.md
          retention-days: 30
