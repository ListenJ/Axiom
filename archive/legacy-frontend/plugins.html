<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>插件市场 - OpenClaw AI Agent</title>
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --surface-hover: #334155;
      --primary: #3b82f6; --primary-hover: #2563eb; --success: #10b981;
      --warning: #f59e0b; --error: #ef4444; --text: #f1f5f9;
      --text-secondary: #94a3b8; --border: #334155;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.8rem; background: linear-gradient(135deg, var(--primary), #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .tab { padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; background: var(--surface); border: 1px solid var(--border); transition: all 0.2s; }
    .tab.active { background: var(--primary); color: white; border-color: var(--primary); }
    .tab:hover:not(.active) { background: var(--surface-hover); }
    .search-bar { width: 100%; padding: 0.75rem 1rem; border-radius: 0.5rem; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 1rem; margin-bottom: 1.5rem; }
    .search-bar:focus { outline: none; border-color: var(--primary); }
    .plugin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
    .plugin-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 0.75rem;
      padding: 1.25rem; transition: all 0.2s; cursor: pointer;
    }
    .plugin-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); border-color: var(--primary); }
    .plugin-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
    .plugin-icon { width: 40px; height: 40px; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; background: linear-gradient(135deg, var(--primary), #8b5cf6); }
    .plugin-title { font-weight: 600; font-size: 1.1rem; }
    .plugin-version { font-size: 0.75rem; color: var(--text-secondary); background: var(--bg); padding: 0.15rem 0.5rem; border-radius: 0.25rem; }
    .plugin-desc { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.75rem; }
    .plugin-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.75rem; }
    .tag { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 0.25rem; background: var(--bg); color: var(--text-secondary); }
    .plugin-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .plugin-author { font-size: 0.8rem; color: var(--text-secondary); }
    .plugin-actions { display: flex; gap: 0.5rem; }
    .btn { padding: 0.4rem 0.8rem; border-radius: 0.4rem; border: none; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); color: white; }
    .btn-warning { background: var(--warning); color: white; }
    .btn-secondary { background: var(--surface-hover); color: var(--text); }
    .status-badge { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 0.25rem; }
    .status-enabled { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .status-disabled { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .status-installed { background: rgba(59, 130, 246, 0.2); color: var(--primary); }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: var(--surface); border-radius: 0.75rem; padding: 2rem; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .modal-close { background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; }
    .config-field { margin-bottom: 1rem; }
    .config-field label { display: block; margin-bottom: 0.3rem; font-size: 0.9rem; }
    .config-field input { width: 100%; padding: 0.5rem; border-radius: 0.4rem; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    .loading { text-align: center; padding: 2rem; color: var(--text-secondary); }
    .empty { text-align: center; padding: 3rem; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔌 插件市场</h1>
      <div style="color: var(--text-secondary);">OpenClaw AI Agent v2.2.0</div>
    </header>

    <div class="tabs">
      <div class="tab active" data-tab="installed">已安装</div>
      <div class="tab" data-tab="available">可用插件</div>
      <div class="tab" data-tab="tools">活跃工具</div>
    </div>

    <input type="text" class="search-bar" id="search" placeholder="搜索插件...">

    <div id="content"><div class="loading">加载中...</div></div>
  </div>

  <!-- Plugin Detail Modal -->
  <div class="modal" id="pluginModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">插件详情</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const API_BASE = '';
    let currentTab = 'installed';
    let plugins = [];
    let availablePlugins = [];

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        render();
      });
    });

    // Search
    document.getElementById('search').addEventListener('input', (e) => {
      render(e.target.value);
    });

    async function fetchPlugins() {
      try {
        const res = await fetch(`${API_BASE}/plugins`);
        const data = await res.json();
        plugins = data.plugins || [];
      } catch (err) {
        console.error('Failed to fetch plugins:', err);
        plugins = [];
      }
    }

    async function fetchAvailable() {
      try {
        const res = await fetch(`${API_BASE}/plugins/available`);
        const data = await res.json();
        availablePlugins = data.plugins || [];
      } catch (err) {
        console.error('Failed to fetch available plugins:', err);
        availablePlugins = [];
      }
    }

    function render(search = '') {
      const content = document.getElementById('content');
      const items = currentTab === 'installed' ? plugins :
                   currentTab === 'available' ? availablePlugins : [];

      const filtered = search ? items.filter(p =>
        p.name.toLowerCase().includes(search.toLowerCase()) ||
        p.description.toLowerCase().includes(search.toLowerCase()) ||
        p.tags?.some(t => t.toLowerCase().includes(search.toLowerCase()))
      ) : items;

      if (currentTab === 'tools') {
        renderTools(content);
        return;
      }

      if (!filtered.length) {
        content.innerHTML = `<div class="empty">
          <div style="font-size: 3rem; margin-bottom: 1rem;">📦</div>
          <div>${currentTab === 'installed' ? '暂无已安装插件' : '暂无可用插件'}</div>
        </div>`;
        return;
      }

      content.innerHTML = `<div class="plugin-grid">${filtered.map(p => createPluginCard(p)).join('')}</div>`;
    }

    function createPluginCard(p) {
      const isInstalled = p.status !== 'available';
      const isEnabled = p.status === 'enabled';

      return `<div class="plugin-card" onclick="showDetail('${p.id}')">
        <div class="plugin-header">
          <div class="plugin-icon">${p.icon || '🔌'}</div>
          <div>
            <div class="plugin-title">${p.name}</div>
            <span class="plugin-version">v${p.version}</span>
          </div>
        </div>
        <div class="plugin-desc">${p.description}</div>
        <div class="plugin-tags">${(p.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <div class="plugin-footer">
          <span class="plugin-author">👤 ${p.author}</span>
          <div class="plugin-actions" onclick="event.stopPropagation()">
            ${isInstalled ? `
              <span class="status-badge ${isEnabled ? 'status-enabled' : 'status-disabled'}">${isEnabled ? '✓ 已启用' : '⏸ 已禁用'}</span>
              <button class="btn ${isEnabled ? 'btn-warning' : 'btn-success'}" onclick="togglePlugin('${p.id}', ${isEnabled})">${isEnabled ? '禁用' : '启用'}</button>
              <button class="btn btn-secondary" onclick="uninstallPlugin('${p.id}')">卸载</button>
            ` : `
              <button class="btn btn-primary" onclick="installPlugin('${p.id}')">安装</button>
            `}
          </div>
        </div>
      </div>`;
    }

    async function renderTools(container) {
      try {
        const res = await fetch(`${API_BASE}/plugins/active-tools`);
        const data = await res.json();
        const tools = data.tools || [];

        if (!tools.length) {
          container.innerHTML = '<div class="empty"><div style="font-size: 3rem; margin-bottom: 1rem;">🔧</div><div>暂无活跃工具</div></div>';
          return;
        }

        container.innerHTML = `<div class="plugin-grid">${tools.map(t => `
          <div class="plugin-card">
            <div class="plugin-header">
              <div class="plugin-icon">🔧</div>
              <div class="plugin-title">${t.pluginId}</div>
            </div>
            <div class="plugin-desc">工具数量: ${t.tools.length}</div>
            <div class="plugin-tags">${t.tools.map(tool => `<span class="tag">${tool}</span>`).join('')}</div>
          </div>
        `).join('')}</div>`;
      } catch (err) {
        container.innerHTML = '<div class="empty">加载失败</div>';
      }
    }

    async function installPlugin(id) {
      try {
        const res = await fetch(`${API_BASE}/plugins/install`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: `./plugins/${id}`, enable: true })
        });
        const data = await res.json();
        if (data.success) {
          alert(`✅ ${data.plugin.name} 安装成功`);
          await fetchPlugins();
          render();
        } else {
          alert(`❌ 安装失败: ${data.error}`);
        }
      } catch (err) {
        alert('安装失败');
      }
    }

    async function uninstallPlugin(id) {
      if (!confirm('确定要卸载此插件吗？')) return;
      try {
        const res = await fetch(`${API_BASE}/plugins/${id}/uninstall`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          alert('✅ 卸载成功');
          await fetchPlugins();
          render();
        }
      } catch (err) {
        alert('卸载失败');
      }
    }

    async function togglePlugin(id, isEnabled) {
      try {
        const action = isEnabled ? 'disable' : 'enable';
        const res = await fetch(`${API_BASE}/plugins/${id}/${action}`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          await fetchPlugins();
          render();
        }
      } catch (err) {
        alert('操作失败');
      }
    }

    function showDetail(id) {
      const p = plugins.find(p => p.id === id) || availablePlugins.find(p => p.id === id);
      if (!p) return;

      document.getElementById('modalTitle').textContent = p.name;
      document.getElementById('modalBody').innerHTML = `
        <p><strong>描述:</strong> ${p.description}</p>
        <p><strong>版本:</strong> ${p.version}</p>
        <p><strong>作者:</strong> ${p.author}</p>
        <p><strong>分类:</strong> ${p.category}</p>
        <p><strong>标签:</strong> ${(p.tags || []).join(', ')}</p>
        <p><strong>状态:</strong> ${p.status}</p>
        ${p.docsUrl ? `<p><a href="${p.docsUrl}" target="_blank">📖 文档</a></p>` : ''}
      `;
      document.getElementById('pluginModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('pluginModal').classList.remove('active');
    }

    // Init
    async function init() {
      await Promise.all([fetchPlugins(), fetchAvailable()]);
      render();
    }

    init();
  </script>
</body>
</html>
