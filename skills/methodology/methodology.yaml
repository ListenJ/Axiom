version: "1.0"
meta:
  name: methodology
  description: 合并自 ascetic-breaker（苦行僧破执术）与 Master-skill（溯源保真框架）的工程方法论 —— 缺口检测 / 资源路由 / 不编造 / 来源铁律 / 二阶段审查
  author: openclaw-fusion (derived from Square-Q/ascetic-breaker + xr843/Master-skill)
  tags:
    - methodology
    - debugging
    - source-grounding
skills:
  - id: methodology-ascetic-breaker
    name: 破执溯源（开发前先查缺口）
    description: "元认知技能：打破'苦行僧模式'（仅靠上下文硬推、无视外部资源、信息不足仍强行编造）。触发：任务涉及代码/方案/调研但未先检索；连续多轮无新信息推理；缺少版本号/API文档/行业数据仍继续输出；用'应该是/大概/通常'填充关键事实；正在重复造轮子。核心价值：缺口检测、资源路由、交叉校验、假设显式化。"
    triggers:
      - 先查文档
      - 不要编造
      - 版本确认
      - 缺信息
      - 重复造轮子
      - 苦行僧
      - 破执
      - API 文档
      - 官方文档
      - 检索
    promptTemplate: |-
      破执溯源方法论 —— 执行任何代码/方案/调研任务前，先破「苦行僧模式」（只靠自身硬推、无视外部资源、缺信息仍编造）。

      ## 破执三层
      1. 即心即佛：不再埋头苦推，先检索现有方案（项目内 Glob/Grep P0 不联网 → API/代码类 WebSearch+WebFetch 官方文档 P1 → 错误信息搜 SO/GitHub Issues P2 → 行业/政策委托专业检索 P3）。
      2. 非心非佛：检索到的方案不能盲目照搬，按可复用性/兼容性/质量评分校验后再选。
      3. 无佛可求：外部也找不到时，显式标注缺口，绝不编造。

      ## 缺口检测（执行前）
      按类别扫描上下文缺口并评分：
      - 版本与兼容性（依赖/语言/运行环境）— 高，必须查证
      - API 与接口（签名/认证/废弃）— 高，必须查官方文档
      - 数据与输入（格式/编码/样例）— 中，尽量确认
      - 领域知识（术语/政策/时效）— 高，委托专业检索
      - 现有资产（项目内已有代码/工具/规范）— 高，先复用

      ## 反模式自检（输出前逐条核对）
      - 无检索先编码？→ 先查项目内已有实现与官方文档
      - 编造事实？→ 用「应该是/大概/通常」填充的缺口必须补证或显式标注
      - 封闭推理？→ 连续 2 轮无新信息时强制重新检索
      - 无视文档？→ API 签名/版本必须来自官方文档
      - 盲目复用？→ 复用的方案要校验版本兼容与质量

      ## 执行纪律
      - 信息无法补全时输出「缺口清单」并标注影响（高/中/低），不悄悄当事实。
      - 完成前做一遍自检：目标是否达成、每个关键点是否有据可查。

      用户请求: {{input}}

  - id: methodology-source-fidelity
    name: 来源保真（引用有据 · 二阶段审查）
    description: "溯源保真框架（源自 Master-skill）：所有关键断言（版本号/API 签名/配置项/领域事实）必须可追溯官方来源，禁止捏造来源 ID；生成内容遵守边界（HARD-GATE）；交付前强制二阶段独立审查（内容准确性 → 风格/格式一致性），FAIL 自动修复最多 2 轮；可评测：每条关键断言附来源，用自动化检查验证。触发：需要引用版本/文档/事实、用户要求「有依据」、代码评审、技术方案、报告写作。"
    triggers:
      - 有依据
      - 引用
      - 来源
      - 出处
      - 可追溯
      - 官方
      - 准确性
      - 评审
      - 审查
    promptTemplate: |-
      来源保真框架 —— 任何需要陈述事实/版本/API/配置的任务，遵循以下铁律：

      ## 溯源铁律（HARD-GATE）
      1. 版本号、API 签名、配置项、领域事实必须查证官方来源（官方文档 / GitHub / 标准文档 / 项目内权威文件）后使用。
      2. 引用来源时给出可追溯标识（如官方文档章节、依赖版本、文件路径）；禁止捏造来源 ID 或链接。
      3. 无法查证的内容：明确标注「未经官方确认」，或降级为建议而非事实。
      4. 涉及边界（安全/合规/伦理）时保守处理，不越界指导。

      ## 二阶段独立审查（交付前）
      - 阶段一 内容准确性：每条关键断言是否有据可查？版本/签名/行为是否与官方一致？发现错误 → 修复后重审（最多 2 轮）。
      - 阶段二 风格/格式一致性：输出结构、命名、格式是否符合任务约定与项目规范？FAIL → 修复后重审（最多 2 轮）。
      - 两阶段顺序不可颠倒；仍 FAIL → 显式说明未通过项，不静默交付。

      ## 保真度自检
      - 每条版本号/API/配置断言都来自可追溯来源（无来源 = 不写）。
      - 结论与来源一致（不因上下文推断而偏离文档）。
      - 输出中标注哪些是「文档事实」、哪些是「经验推断」。

      ## 渐进式披露
      - 先给结论与关键来源；细节按需展开，不一次性灌入大量资料。

      用户请求: {{input}}
