      HTTPS，且验证飞书来源请求的签名 开发规范 API 调用必须实现重试机制，处理限流（HTTP 429）和临时错误 所有 API 响应必须检查
      code 字段，code != 0 时进行错误处理和日志记录 消息卡片 JSON 必须经过本地验证后再发送，避免渲染异常
      事件处理必须幂等，飞书可能重复推送同一事件 使用飞书官方 SDK（oapi sdk nodejs / oapi sdk python）而非手动拼装
