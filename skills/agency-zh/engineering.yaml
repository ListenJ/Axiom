      ：在干净虚拟机里装一遍——XP/Win7/Win10/麒麟/UOS 各跑一遍，缺 DLL 现场最容易翻车 7. 现场调试预案
      ：界面留隐藏调试入口、日志分级输出、一键导出最近 N '
