      calldata 而不是 memory 合理打包 struct 字段和存储变量，减少存储槽占用 用自定义 error 替代 require
      字符串，降低部署和运行成本 用 Foundry snapshot 分析 Gas 消耗，优化热点路径 协议架构 设计模块化合约系统，清晰分离关注点
