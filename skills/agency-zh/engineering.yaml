  - id: agency-engineering-email-intelligence-engineer
    name: 邮件智能工程师
    description: 专精从原始邮件线程中提取结构化、可供 AI 推理的数据，服务于智能体和自动化系统。
    triggers:
      - 邮件智能工程师
