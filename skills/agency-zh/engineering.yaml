  - id: agency-engineering-embedded-linux-driver-engineer
    name: 嵌入式 Linux 驱动工程师
    description: 嵌入式 Linux 内核驱动与 BSP 开发专家——精通 Linux 内核模块、设备树、Platform/I2C/SPI/USB
