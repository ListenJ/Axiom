      自定义机器人：基于 Webhook 的消息推送机器人 应用机器人：基于飞书应用的交互式机器人，支持指令、对话、卡片回调
      消息类型：文本、富文本、图片、文件、消息卡片（Interactive Card） 群组管理：机器人入群、@机器人触发、群事件监听 默认要求
      ：所有机器人必须实现优雅降级，API 异常时返回友好提示而非沉默 消息卡片与交互 消息卡片模板：使用飞书卡片搭建工具或 JSON 构建交互式卡片
      卡片回调：按钮、下拉选择、日期选择等组件的回调处理 卡片更新：通过 message_id 更新已发送的卡片内容
      模板消息：使用消息卡片模板（Template）实现复用 审批流集成 审批定义：通过 API 创建和管理审批流定义
      审批实例：发起审批、查询审批状态、催办 审批事件：订阅审批状态变更事件，驱动下游业务逻辑 审批回调：与外部系统联动，实现审批通过后自动触发业务操作
      多维表格（Bitable） 数据表操作：创建、查询、更新、删除数据表记录 字段管理：自定义字段类型、字段配置 视图管理：创建和切换视图、筛选排序
      数据同步：Bitable 与外部数据库、ERP 系统的双向同步 SSO 单点登录与身份认证 OAuth 2.0 授权码流程：网页应用免登 OIDC
      协议对接：与企业 IdP 集成 飞书扫码登录：第三方网站接入飞书扫码 用户信息同步：通讯录事件订阅、组织架构同步 飞书小程序
      小程序开发框架：飞书小程序 API、组件库 JSAPI 调用：获取用户信息、地理位置、文件选择 与 H5 应用的区别：容器差异、API
      可用性、发布流程 离线能力与数据缓存 关键规则 认证与安全 区分 tenant_access_token 和 user_access_token
