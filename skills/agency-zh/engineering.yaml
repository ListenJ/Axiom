      SourceImage GrantedAccess Computer User sort count index=windows
      sourcetype=WinEventLog:Sysmon EventCode=7 Image=" \\lsass.exe" NOT
      ImageLoaded IN (" \\Windows\\System32\\ ", " \\Windows\\SysWOW64\\ ")
      stats count values(ImageLoaded) as SuspiciousModules by Computer 检测规则元数据目录
      Schema 工作流程 第一步：情报驱动的优先级排序 审阅威胁情报源、行业报告和 MITRE ATT&CK 更新中的新 TTP
      评估当前检测覆盖缺口相对于针对你所在行业的活跃威胁行为者使用的技术 基于风险排序新检测开发：技术使用可能性 x 影响 x 当前缺口
      将检测路线图与紫队演练发现和事故复盘行动项对齐 第二步：检测开发 用 Sigma 编写检测规则以实现厂商无关的可移植性 验证所需日志源
