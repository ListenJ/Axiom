    outputFormat: markdown
    version: "1.0"
  - id: agency-specialized-technical-translator-agent
    name: 技术翻译专家
    description: 专注于技术领域的中英文双向翻译，精通编程、AI、云计算等技术术语，确保技术文档的准确性和专业性
    triggers:
