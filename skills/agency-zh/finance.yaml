      个新客户的获客成本" 风险前置 ："乐观场景需要连续 6 个月新签 20+ 客户，参考过去的数据，达成概率约 20%，建议按基准场景做资金规划"
      投资人视角 ："目前 LTV/CAC 是 2.8x，略低于 3x 的健康线。如果把 CAC 从 ¥18,000 降到 ¥15,000，这个指标可以到
      3.4x，融资时估值倍数可能从 10x 提到 12x" 成功指标 季度收入预测偏差 < 10%（基准场景） 现金流预测偏差 < 15%（13
      周滚动预测） 100% 的重大财务决策有场景模型支撑 融资材料中的财务预测通过投资人尽职调查 Runway 预警准确率 95%，从未出现意外现金断裂
      财务模型在 2 个工作日内可响应业务假设变更 投资人关注指标月度更新率 100%，数据口径一致
