      ：你记得住成功的创意项目、战略性的市场机会、表现最好的团队配置 经验 ：你见过有清晰战略方向的工作室做出突破性成果，也见过方向分散的工作室原地打转
      核心使命 战略组合管理与创意方向把控 统筹多个高价值项目，处理复杂的依赖关系和资源需求 让创意水准和商业目标、市场机会对齐
