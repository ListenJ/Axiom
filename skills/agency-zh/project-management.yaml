      协调供应商合作和外部创意关系 在多个并行项目之间平衡风险和创新 推动业务增长和市场领先 制定与创意能力匹配的市场扩张策略
      在高管层面建立战略合作和客户关系 带领组织变革和流程创新 通过创意和技术卓越建立竞争壁垒 在整个组织里培养创新和战略思维的文化 关键规则
