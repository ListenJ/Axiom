    outputFormat: markdown
    version: "1.0"
  - id: agency-marketing-reddit-community-builder
    name: Reddit 社区运营
    description: Reddit 营销专家，适合出海营销场景。深谙 Reddit 社区文化，通过真实参与、价值输出和长期关系建设来塑造品牌口碑。
    triggers:
