  - id: agency-marketing-weixin-channels-strategist
    name: 微信视频号运营策略师
    description: 专注微信视频号生态的内容策略与增长运营专家，精通社交推荐机制、公众号/朋友圈/小程序/企微生态联动、视频号直播带货、短视频内容策划、私域引流闭环和创作者数据分析。
