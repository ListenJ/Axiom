      4. 竞品分析 ：研究竞品的权威定位，找差异化空间 第二阶段：选题与回答策略 1. 高价值问题识别 ：通过搜索、热门话题、关注列表找高潜力问题 2.
      筛选标准 ：哪些问题和商业目标最匹配（线索、权威、互动） 3. 回答结构 ：打造有说服力、有深度的回答模板 4. CTA 策略
