name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 非交互 shell 不读 ~/.bashrc，工具链必须显式进 PATH
  PATH: /home/data/.bun/bin:/home/data/.local/bin:/home/data/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  NODE_ENV: test

jobs:
  verify:
    name: typecheck + doc gates
    runs-on: linux-amd64
    timeout-minutes: 20
    steps:
      # data / WSL 均无法访问 github.com，因此不引入任何 uses: 外部 action，
      # 检出用 Gitea 自带的临时 token 走本机 HTTP。
      - name: 检出代码
        run: |
          set -eu
          echo "repo=${GITHUB_REPOSITORY} ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
          git init -q .
          git remote add origin "http://x-access-token:${GITHUB_TOKEN}@127.0.0.1:3000/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          echo "HEAD=$(git rev-parse --short HEAD)"
          ls -A | head -10

      - name: 环境自述
        run: |
          uname -a
          command -v bun  && bun --version  || echo "bun MISSING"
          command -v node && node --version || echo "node MISSING"

      - name: 依赖安装
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun node_modules/typescript/bin/tsc --noEmit

      - name: 文档与口径门禁
        run: bun test tests/doc-contract.test.ts tests/unit/docs-consistency.test.ts
